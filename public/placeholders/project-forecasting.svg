      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="26%" r="55%">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
