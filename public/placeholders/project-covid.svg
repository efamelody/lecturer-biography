<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustrative placeholder for the COVID-19 and Monsoon Asia air quality project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="26%" r="55%">
      <stop offset="0" stop-color="#99f6e4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
