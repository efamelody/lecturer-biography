  <text x="90" y="640" fill="#99f6e4" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">COVID-19 · CROSS-COUNTRY ASSESSMENT</text>
  <text x="90" y="800" fill="#99f6e4" font-family="Arial, sans-serif" font-size="14" letter-spacing="3">ILLUSTRATIVE PLACEHOLDER</text>
